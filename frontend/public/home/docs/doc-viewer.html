<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>文档中心</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      color: #1f2d3d;
      font-family: "Microsoft YaHei", "PingFang SC", "Hiragino Sans GB", "Noto Sans CJK SC", sans-serif;
    }

    .page {
      max-width: 1060px;
      margin: 24px auto;
      padding: 0 14px;
    }

    .card {
      background: #ffffff;
      border: 1px solid #e1e9f3;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(50, 86, 120, 0.08);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid #e9eff7;
      background: linear-gradient(180deg, #fbfdff 0%, #f6faff 100%);
    }

    .title {
      margin: 0;
      font-size: 18px;
      color: #214a69;
      font-weight: 600;
      line-height: 1.4;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #ccdeed;
      background: #ffffff;
      color: #2c5879;
      border-radius: 8px;
      font-size: 13px;
      padding: 6px 10px;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
    }

    .btn:hover {
      border-color: #9dbfdb;
      background: #f4faff;
    }

    .btn.current {
      background: #2f78af;
      border-color: #2f78af;
      color: #ffffff;
    }

    #docContent {
      min-height: 260px;
      padding: 18px 18px 22px;
      line-height: 1.75;
      font-size: 15px;
      color: #2b3f50;
      word-break: break-word;
    }

    #docContent.error {
      color: #b42318;
      font-family: "Microsoft YaHei", sans-serif;
    }

    .raw-content {
      white-space: pre-wrap;
      font-family: Consolas, "Courier New", monospace;
      font-size: 14px;
      line-height: 1.72;
      color: #2f4558;
      margin: 0;
    }

    .md h1,
    .md h2,
    .md h3,
    .md h4,
    .md h5,
    .md h6 {
      color: #1f4967;
      margin: 0.9em 0 0.5em;
      line-height: 1.35;
    }

    .md h1 {
      font-size: 28px;
      border-bottom: 1px solid #e5edf6;
      padding-bottom: 8px;
    }

    .md h2 {
      font-size: 22px;
      border-bottom: 1px solid #edf2f8;
      padding-bottom: 6px;
    }

    .md h3 {
      font-size: 18px;
    }

    .md p {
      margin: 0.66em 0;
    }

    .md ul,
    .md ol {
      margin: 0.6em 0 0.6em 1.5em;
      padding: 0;
    }

    .md li {
      margin: 0.3em 0;
    }

    .md blockquote {
      margin: 0.8em 0;
      padding: 0.5em 1em;
      border-left: 4px solid #c7dced;
      background: #f7fbff;
      color: #3f5f78;
    }

    .md code {
      background: #edf4fb;
      color: #1f537a;
      border-radius: 5px;
      padding: 0.1em 0.38em;
      font-size: 0.92em;
      font-family: Consolas, "Courier New", monospace;
    }

    .md pre {
      margin: 0.9em 0;
      padding: 12px 14px;
      overflow-x: auto;
      border-radius: 10px;
      border: 1px solid #dce8f4;
      background: #f6faff;
    }

    .md pre code {
      background: transparent;
      border-radius: 0;
      padding: 0;
      color: #2a4a62;
      font-size: 0.9em;
    }

    .md a {
      color: #2f78af;
      text-decoration: none;
      border-bottom: 1px dashed rgba(47, 120, 175, 0.5);
    }

    .md a:hover {
      color: #1f5f90;
      border-bottom-color: rgba(31, 95, 144, 0.9);
    }
  </style>
</head>
<body>
<main class="page">
  <section class="card">
    <header class="toolbar">
      <h1 class="title" id="docTitle">文档中心</h1>
      <div class="actions">
        <a id="viewMarkdownLink" class="btn" href="#">Markdown 视图</a>
        <a id="viewRawLink" class="btn" href="#">打开原始文件</a>
        <button id="reloadBtn" class="btn" type="button">重新加载</button>
      </div>
    </header>
    <article id="docContent">正在加载文档...</article>
  </section>
</main>

<script>
  (function () {
    var ALLOWED_FILES = {
      "project-background.md": true,
      "user-manual.md": true,
      "changelog.md": true,
      "roadmap.md": true
    };

    var titleEl = document.getElementById("docTitle");
    var contentEl = document.getElementById("docContent");
    var viewMarkdownLinkEl = document.getElementById("viewMarkdownLink");
    var viewRawLinkEl = document.getElementById("viewRawLink");
    var reloadBtnEl = document.getElementById("reloadBtn");

    var params = new URLSearchParams(window.location.search);
    var file = (params.get("file") || "").trim();
    var mode = (params.get("mode") || "markdown").trim().toLowerCase();
    if (mode !== "raw") {
      mode = "markdown";
    }

    function buildQuery(targetMode) {
      return "doc-viewer.html?file=" + encodeURIComponent(file) + "&mode=" + encodeURIComponent(targetMode);
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function renderInlineMarkdown(text) {
      var escaped = escapeHtml(text);
      var codeStore = [];

      escaped = escaped.replace(/`([^`]+)`/g, function (_, code) {
        var idx = codeStore.length;
        codeStore.push("<code>" + code + "</code>");
        return "@@CODE_" + idx + "@@";
      });

      escaped = escaped.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, label, url) {
        var safeUrl = escapeHtml(url);
        return "<a href=\"" + safeUrl + "\" target=\"_blank\" rel=\"noopener\">" + label + "</a>";
      });

      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      escaped = escaped.replace(/\*(?!\s)([^*]+)\*/g, "<em>$1</em>");

      escaped = escaped.replace(/@@CODE_(\d+)@@/g, function (_, idxText) {
        var idx = Number(idxText);
        return codeStore[idx] || "";
      });

      return escaped;
    }

    function renderMarkdownToHtml(markdownText) {
      var text = markdownText.replace(/\r\n?/g, "\n");
      var lines = text.split("\n");
      var html = [];
      var i = 0;

      function isOrderedListLine(line) {
        return /^\d+\.\s+/.test(line);
      }

      while (i < lines.length) {
        var line = lines[i];
        var trimmed = line.trim();

        if (!trimmed) {
          i += 1;
          continue;
        }

        if (/^```/.test(trimmed)) {
          var codeLines = [];
          i += 1;
          while (i < lines.length && !/^```/.test(lines[i].trim())) {
            codeLines.push(lines[i]);
            i += 1;
          }
          if (i < lines.length) {
            i += 1;
          }
          html.push("<pre><code>" + escapeHtml(codeLines.join("\n")) + "</code></pre>");
          continue;
        }

        var headingMatch = trimmed.match(/^(#{1,6})\s+(.+)$/);
        if (headingMatch) {
          var level = headingMatch[1].length;
          html.push("<h" + level + ">" + renderInlineMarkdown(headingMatch[2]) + "</h" + level + ">");
          i += 1;
          continue;
        }

        if (/^>\s?/.test(trimmed)) {
          var quoteLines = [];
          while (i < lines.length && /^>\s?/.test(lines[i].trim())) {
            quoteLines.push(lines[i].trim().replace(/^>\s?/, ""));
            i += 1;
          }
          html.push("<blockquote>" + renderInlineMarkdown(quoteLines.join("<br>")) + "</blockquote>");
          continue;
        }

        if (/^- /.test(trimmed)) {
          var ulItems = [];
          while (i < lines.length && /^- /.test(lines[i].trim())) {
            ulItems.push("<li>" + renderInlineMarkdown(lines[i].trim().replace(/^- /, "")) + "</li>");
            i += 1;
          }
          html.push("<ul>" + ulItems.join("") + "</ul>");
          continue;
        }

        if (isOrderedListLine(trimmed)) {
          var olItems = [];
          while (i < lines.length && isOrderedListLine(lines[i].trim())) {
            olItems.push("<li>" + renderInlineMarkdown(lines[i].trim().replace(/^\d+\.\s+/, "")) + "</li>");
            i += 1;
          }
          html.push("<ol>" + olItems.join("") + "</ol>");
          continue;
        }

        var paragraphLines = [];
        while (i < lines.length) {
          var current = lines[i];
          var currentTrim = current.trim();
          if (!currentTrim) {
            break;
          }
          if (
            /^```/.test(currentTrim) ||
            /^(#{1,6})\s+/.test(currentTrim) ||
            /^>\s?/.test(currentTrim) ||
            /^- /.test(currentTrim) ||
            isOrderedListLine(currentTrim)
          ) {
            break;
          }
          paragraphLines.push(currentTrim);
          i += 1;
        }
        html.push("<p>" + renderInlineMarkdown(paragraphLines.join(" ")) + "</p>");
      }

      return html.join("\n");
    }

    function setModeLinks() {
      viewMarkdownLinkEl.href = buildQuery("markdown");
      viewRawLinkEl.href = buildQuery("raw");

      viewMarkdownLinkEl.classList.toggle("current", mode === "markdown");
      viewRawLinkEl.classList.toggle("current", mode === "raw");
    }

    function renderText(text) {
      if (mode === "raw") {
        contentEl.className = "";
        contentEl.innerHTML = "<pre class=\"raw-content\">" + escapeHtml(text) + "</pre>";
        return;
      }

      contentEl.className = "md";
      contentEl.innerHTML = renderMarkdownToHtml(text);
    }

    async function loadDoc() {
      if (!ALLOWED_FILES[file]) {
        titleEl.textContent = "文档不存在";
        contentEl.className = "error";
        contentEl.textContent = "未找到指定文档，请从首页“文档中心”重新进入。";
        viewMarkdownLinkEl.style.display = "none";
        viewRawLinkEl.style.display = "none";
        return;
      }

      setModeLinks();
      contentEl.className = "";
      contentEl.textContent = "正在加载文档...";

      try {
        var response = await fetch(file, { cache: "no-cache" });
        if (!response.ok) {
          throw new Error("文档加载失败");
        }

        var buffer = await response.arrayBuffer();
        var text = new TextDecoder("utf-8").decode(new Uint8Array(buffer)).replace(/^\uFEFF/, "");

        var headingMatch = text.match(/^#\s+(.+)$/m);
        var docTitle = headingMatch ? headingMatch[1].trim() : file;
        titleEl.textContent = docTitle;
        document.title = docTitle + " - 文档中心";

        renderText(text);
      } catch (_) {
        titleEl.textContent = "加载失败";
        contentEl.className = "error";
        contentEl.textContent = "文档加载失败，请稍后重试。";
      }
    }

    reloadBtnEl.addEventListener("click", function () {
      loadDoc();
    });

    loadDoc();
  })();
</script>
</body>
</html>
